# ==============================================================================
# NT531 - Zabbix Agent 2 UserParameter đo hiệu năng liên kết (BẢN ĐÃ SỬA)
# Đặt file tại: /etc/zabbix/zabbix_agent2.d/nt531_agent_infra.conf (trên máy C)
# Nhớ đặt Timeout=10 trong /etc/zabbix/zabbix_agent2.conf vì lệnh ping nhiều gói.
# Khởi động lại agent: sudo systemctl restart zabbix-agent2
#
# Cách dùng key trong Zabbix (IP là IP CÁP của máy B, ví dụ 10.10.0.1):
#   nt531.ping.rtt[10.10.0.1]     -> độ trễ RTT (ms)
#   nt531.ping.loss[10.10.0.1]    -> tỷ lệ mất gói (%)
#   nt531.tc.backlog[eth0]        -> độ dài hàng đợi qdisc (byte)
#   nt531.tc.drops[eth0]          -> số gói bị loại ở qdisc
# ==============================================================================

UserParameter=nt531.ping.rtt[*],ping -c 3 -i 0.2 -W 2 "$1" 2>/dev/null | tail -1 | cut -d'/' -f5
UserParameter=nt531.ping.loss[*],ping -c 5 -i 0.2 -W 2 "$1" 2>/dev/null | grep -o '[0-9]*% packet loss' | grep -o '[0-9]*' || echo 100
UserParameter=nt531.tc.backlog[*],tc -s qdisc show dev "$1" 2>/dev/null | grep -o 'backlog [0-9]*b' | grep -o '[0-9]*' | head -n 1 || echo 0
UserParameter=nt531.tc.drops[*],tc -s qdisc show dev "$1" 2>/dev/null | grep -o 'dropped [0-9]*' | grep -o '[0-9]*' | head -n 1 || echo 0
