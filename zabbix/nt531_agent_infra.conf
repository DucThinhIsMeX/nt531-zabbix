# ==============================================================================
# NT531 - Zabbix Agent 2 Infrastructure Telemetry Configuration
# Đặt file này tại: /etc/zabbix/zabbix_agent2.d/nt531_infra.conf (hoặc zabbix_agentd.d/)
# Khởi động lại agent: sudo systemctl restart zabbix-agent2
# ==============================================================================

# 1. ICMP RTT trung bình (ms) xuyên liên kết bị bóp
# Sử dụng 3 gói ping với timeout 2s để lọc nhiễu jitter mẫu đơn
# Cách dùng trong Zabbix: nt531.ping.rtt[IP_BROKER]
UserParameter=nt531.ping.rtt[*],ping -n -c 3 -W 2 "$1" 2>/dev/null | awk -F'/' 'END {if ($5) print $5; else print 0}'

# 2. Tỷ lệ mất gói ICMP Packet Loss (%) xuyên liên kết bị bóp
# Cách dùng trong Zabbix: nt531.ping.loss[IP_BROKER]
UserParameter=nt531.ping.loss[*],ping -n -c 5 -W 2 "$1" 2>/dev/null | grep -oP '\d+(?=% packet loss)' || echo 100

# 3. Đo dung lượng hàng đợi qdisc hiện tại trên interface C
# Cho biết số gói đang bị đệm hoặc drop tại tầng qdisc của Linux
UserParameter=nt531.tc.backlog[*],tc -s qdisc show dev "$1" 2>/dev/null | grep -oP 'backlog \K\d+(?=b)' | head -n 1 || echo 0
UserParameter=nt531.tc.drops[*],tc -s qdisc show dev "$1" 2>/dev/null | grep -oP 'dropped \K\d+' | head -n 1 || echo 0

# ==============================================================================
# HƯỚNG DẪN CẤU HÌNH TRÊN GIAO DIỆN ZABBIX SERVER:
# ------------------------------------------------------------------------------
# 1. Định nghĩa Macro trên Host (Lab-A hoặc Lab-B):
#    {$LINK.CAP} = 10M (hoặc 10000000 bps - khớp với trần TBF cấu hình trong netem/tbf)
#    TUYỆT ĐỐI KHÔNG DÙNG 1 Gbps vật lý, vì rho sẽ luôn xấp xỉ 0%.
#
# 2. Tạo Item "Link Utilization (rho)":
#    Type: Calculated
#    Key: net.if.utilization[eth0]
#    Formula: last(//net.if.in["eth0"]) * 8 / ({$LINK.CAP})
#    Units: % (hoặc tỷ lệ 0..1)
# ==============================================================================
